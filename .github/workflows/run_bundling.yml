# Generated from xtask::workflows::run_bundling
# Rebuild with `cargo xtask workflows`.
name: run_bundling
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
on:
  pull_request:
    types:
      - labeled
      - synchronize
jobs:
  bundle_linux_aarch64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: namespace-profile-8x32-ubuntu-2004-arm-m4
    env:
      CARGO_INCREMENTAL: 0
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }} # TODO: rename secret to XENOMORPHIC_CLIENT_CHECKSUM_SEED
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }} # TODO: rename secret to XENOMORPHIC_MINIDUMP_ENDPOINT
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: steps::checkout_repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
      - name: steps::setup_sentry
        uses: matbour/setup-sentry-cli@3e938c54b3018bdd019973689ef984e033b0454b
        with:
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: steps::setup_linux
        run: ./script/linux
      - name: steps::download_wasi_sdk
        run: ./script/download-wasi-sdk
      - name: ./script/bundle-linux
        run: ./script/bundle-linux
      - name: "@actions/upload-artifact xenomorphic-linux-aarch64.tar.gz"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: xenomorphic-linux-aarch64.tar.gz
          path: target/release/xenomorphic-linux-aarch64.tar.gz
          if-no-files-found: error
      - name: "@actions/upload-artifact xenomorphic-remote-server-linux-aarch64.gz"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: xenomorphic-remote-server-linux-aarch64.gz
          path: target/xenomorphic-remote-server-linux-aarch64.gz
          if-no-files-found: error
    timeout-minutes: 60
  bundle_linux_x86_64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: namespace-profile-32x64-ubuntu-2004
    env:
      CARGO_INCREMENTAL: 0
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }} # TODO: rename secret to XENOMORPHIC_CLIENT_CHECKSUM_SEED
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }} # TODO: rename secret to XENOMORPHIC_MINIDUMP_ENDPOINT
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: steps::checkout_repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
      - name: steps::setup_sentry
        uses: matbour/setup-sentry-cli@3e938c54b3018bdd019973689ef984e033b0454b
        with:
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: steps::setup_linux
        run: ./script/linux
      - name: steps::download_wasi_sdk
        run: ./script/download-wasi-sdk
      - name: ./script/bundle-linux
        run: ./script/bundle-linux
      - name: "@actions/upload-artifact xenomorphic-linux-x86_64.tar.gz"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: xenomorphic-linux-x86_64.tar.gz
          path: target/release/xenomorphic-linux-x86_64.tar.gz
          if-no-files-found: error
      - name: "@actions/upload-artifact xenomorphic-remote-server-linux-x86_64.gz"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: xenomorphic-remote-server-linux-x86_64.gz
          path: target/xenomorphic-remote-server-linux-x86_64.gz
          if-no-files-found: error
    timeout-minutes: 60
  bundle_mac_aarch64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: namespace-profile-mac-large
    env:
      CARGO_INCREMENTAL: 0
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }} # TODO: rename secret to XENOMORPHIC_CLIENT_CHECKSUM_SEED
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }} # TODO: rename secret to XENOMORPHIC_MINIDUMP_ENDPOINT
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - name: steps::checkout_repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
      - name: steps::setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: steps::setup_sentry
        uses: matbour/setup-sentry-cli@3e938c54b3018bdd019973689ef984e033b0454b
        with:
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: steps::clear_target_dir_if_large
        run: ./script/clear-target-dir-if-larger-than 350 200
      - name: run_bundling::bundle_mac::bundle_mac
        run: ./script/bundle-mac aarch64-apple-darwin
      - name: "@actions/upload-artifact Xenomorphic-aarch64.dmg"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: Xenomorphic-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Xenomorphic-aarch64.dmg
          if-no-files-found: error
      - name: "@actions/upload-artifact xenomorphic-remote-server-macos-aarch64.gz"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: xenomorphic-remote-server-macos-aarch64.gz
          path: target/xenomorphic-remote-server-macos-aarch64.gz
          if-no-files-found: error
    timeout-minutes: 60
  bundle_mac_x86_64:
    if: |-
      (github.event.action == 'labeled' && github.event.label.name == 'run-bundling') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'run-bundling'))
    runs-on: namespace-profile-mac-large
    env:
      CARGO_INCREMENTAL: 0
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }} # TODO: rename secret to XENOMORPHIC_CLIENT_CHECKSUM_SEED
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }} # TODO: rename secret to XENOMORPHIC_MINIDUMP_ENDPOINT
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - name: steps::checkout_repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
      - name: steps::setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: steps::setup_sentry
        uses: matbour/setup-sentry-cli@3e938c54b3018bdd019973689ef984e033b0454b
        with:
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: steps::clear_target_dir_if_large
        run: ./script/clear-target-dir-if-larger-than 350 200
      - name: run_bundling::bundle_mac::bundle_mac
        run: ./script/bundle-mac x86_64-apple-darwin
      - name: "@actions/upload-artifact Xenomorphic-x86_64.dmg"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: Xenomorphic-x86_64.dmg
          path: target/x86_64-apple-darwin/release/Xenomorphic-x86_64.dmg
          if-no-files-found: error
      - name: "@actions/upload-artifact xenomorphic-remote-server-macos-x86_64.gz"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: xenomorphic-remote-server-macos-x86_64.gz
          path: target/xenomorphic-remote-server-macos-x86_64.gz
          if-no-files-found: error
    timeout-minutes: 60
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euxo pipefail {0}
