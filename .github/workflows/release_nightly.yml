# Generated from xtask::workflows::release_nightly
# Rebuild with `cargo xtask workflows`.
name: release_nightly
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
on:
  push:
    tags:
      - nightly
  schedule:
    - cron: 0 7 * * *
jobs:
  check_style:
    runs-on: namespace-profile-mac-large
    steps:
      - name: steps::checkout_repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
          fetch-depth: 0
      - name: steps::cargo_fmt
        run: cargo fmt --all -- --check
      - name: ./script/clippy
        run: ./script/clippy
    timeout-minutes: 60
  bundle_linux_x86_64:
    needs:
      - check_style
    runs-on: namespace-profile-32x64-ubuntu-2004
    env:
      CARGO_INCREMENTAL: 0
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }} # TODO: rename secret to XENOMORPHIC_CLIENT_CHECKSUM_SEED
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }} # TODO: rename secret to XENOMORPHIC_MINIDUMP_ENDPOINT
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: steps::checkout_repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
      - name: run_bundling::set_release_channel_to_nightly
        run: |
          set -eu
          version=$(git rev-parse --short HEAD)
          echo "Publishing version: ${version} on release channel nightly"
          echo "nightly" > crates/xenomorphic/RELEASE_CHANNEL
      - name: steps::setup_sentry
        uses: matbour/setup-sentry-cli@3e938c54b3018bdd019973689ef984e033b0454b
        with:
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: steps::setup_linux
        run: ./script/linux
      - name: steps::download_wasi_sdk
        run: ./script/download-wasi-sdk
      - name: ./script/bundle-linux
        run: ./script/bundle-linux
      - name: "@actions/upload-artifact xenomorphic-linux-x86_64.tar.gz"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: xenomorphic-linux-x86_64.tar.gz
          path: target/release/xenomorphic-linux-x86_64.tar.gz
          if-no-files-found: error
      - name: "@actions/upload-artifact xenomorphic-remote-server-linux-x86_64.gz"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: xenomorphic-remote-server-linux-x86_64.gz
          path: target/xenomorphic-remote-server-linux-x86_64.gz
          if-no-files-found: error
    timeout-minutes: 60
  bundle_mac_aarch64:
    needs:
      - check_style
    runs-on: namespace-profile-mac-large
    env:
      CARGO_INCREMENTAL: 0
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }} # TODO: rename secret to XENOMORPHIC_CLIENT_CHECKSUM_SEED
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }} # TODO: rename secret to XENOMORPHIC_MINIDUMP_ENDPOINT
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - name: steps::checkout_repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
      - name: run_bundling::set_release_channel_to_nightly
        run: |
          set -eu
          version=$(git rev-parse --short HEAD)
          echo "Publishing version: ${version} on release channel nightly"
          echo "nightly" > crates/xenomorphic/RELEASE_CHANNEL
      - name: steps::setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: steps::setup_sentry
        uses: matbour/setup-sentry-cli@3e938c54b3018bdd019973689ef984e033b0454b
        with:
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: steps::clear_target_dir_if_large
        run: ./script/clear-target-dir-if-larger-than 350 200
      - name: run_bundling::bundle_mac::bundle_mac
        run: ./script/bundle-mac aarch64-apple-darwin
      - name: "@actions/upload-artifact Xenomorphic-aarch64.dmg"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: Xenomorphic-aarch64.dmg
          path: target/aarch64-apple-darwin/release/Xenomorphic-aarch64.dmg
          if-no-files-found: error
      - name: "@actions/upload-artifact xenomorphic-remote-server-macos-aarch64.gz"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: xenomorphic-remote-server-macos-aarch64.gz
          path: target/xenomorphic-remote-server-macos-aarch64.gz
          if-no-files-found: error
    timeout-minutes: 60
  bundle_mac_x86_64:
    needs:
      - check_style
    runs-on: namespace-profile-mac-large
    env:
      CARGO_INCREMENTAL: 0
      ZED_CLIENT_CHECKSUM_SEED: ${{ secrets.ZED_CLIENT_CHECKSUM_SEED }} # TODO: rename secret to XENOMORPHIC_CLIENT_CHECKSUM_SEED
      ZED_MINIDUMP_ENDPOINT: ${{ secrets.ZED_SENTRY_MINIDUMP_ENDPOINT }} # TODO: rename secret to XENOMORPHIC_MINIDUMP_ENDPOINT
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - name: steps::checkout_repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
      - name: run_bundling::set_release_channel_to_nightly
        run: |
          set -eu
          version=$(git rev-parse --short HEAD)
          echo "Publishing version: ${version} on release channel nightly"
          echo "nightly" > crates/xenomorphic/RELEASE_CHANNEL
      - name: steps::setup_node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: steps::setup_sentry
        uses: matbour/setup-sentry-cli@3e938c54b3018bdd019973689ef984e033b0454b
        with:
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: steps::clear_target_dir_if_large
        run: ./script/clear-target-dir-if-larger-than 350 200
      - name: run_bundling::bundle_mac::bundle_mac
        run: ./script/bundle-mac x86_64-apple-darwin
      - name: "@actions/upload-artifact Xenomorphic-x86_64.dmg"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: Xenomorphic-x86_64.dmg
          path: target/x86_64-apple-darwin/release/Xenomorphic-x86_64.dmg
          if-no-files-found: error
      - name: "@actions/upload-artifact xenomorphic-remote-server-macos-x86_64.gz"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: xenomorphic-remote-server-macos-x86_64.gz
          path: target/xenomorphic-remote-server-macos-x86_64.gz
          if-no-files-found: error
    timeout-minutes: 60
  update_nightly_tag:
    needs:
      - bundle_linux_aarch64
      - bundle_linux_x86_64
      - bundle_mac_aarch64
      - bundle_mac_x86_64
    runs-on: namespace-profile-4x8-ubuntu-2204
    steps:
      - name: steps::checkout_repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
          fetch-depth: 0
      - name: release::download_workflow_artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          path: ./artifacts/
      - name: ls -lR ./artifacts
        run: ls -lR ./artifacts
      - name: release::prep_release_artifacts
        run: |-
          mkdir -p release-artifacts/

          mv ./artifacts/Xenomorphic-aarch64.dmg/Xenomorphic-aarch64.dmg release-artifacts/Xenomorphic-aarch64.dmg
          mv ./artifacts/Xenomorphic-x86_64.dmg/Xenomorphic-x86_64.dmg release-artifacts/Xenomorphic-x86_64.dmg
          mv ./artifacts/xenomorphic-linux-aarch64.tar.gz/xenomorphic-linux-aarch64.tar.gz release-artifacts/xenomorphic-linux-aarch64.tar.gz
          mv ./artifacts/xenomorphic-linux-x86_64.tar.gz/xenomorphic-linux-x86_64.tar.gz release-artifacts/xenomorphic-linux-x86_64.tar.gz
          mv ./artifacts/xenomorphic-remote-server-macos-aarch64.gz/xenomorphic-remote-server-macos-aarch64.gz release-artifacts/xenomorphic-remote-server-macos-aarch64.gz
          mv ./artifacts/xenomorphic-remote-server-macos-x86_64.gz/xenomorphic-remote-server-macos-x86_64.gz release-artifacts/xenomorphic-remote-server-macos-x86_64.gz
          mv ./artifacts/xenomorphic-remote-server-linux-aarch64.gz/xenomorphic-remote-server-linux-aarch64.gz release-artifacts/xenomorphic-remote-server-linux-aarch64.gz
          mv ./artifacts/xenomorphic-remote-server-linux-x86_64.gz/xenomorphic-remote-server-linux-x86_64.gz release-artifacts/xenomorphic-remote-server-linux-x86_64.gz
      - name: ./script/upload-nightly
        run: ./script/upload-nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: release_nightly::update_nightly_tag_job::update_nightly_tag
        run: |
          if [ "$(git rev-parse nightly)" = "$(git rev-parse HEAD)" ]; then
            echo "Nightly tag already points to current commit. Skipping tagging."
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f nightly
          git push origin nightly --force
      - name: release::create_sentry_release
        uses: getsentry/action-release@526942b68292201ac6bbb99b9a0747d4abee354c
        with:
          environment: production
        env:
          SENTRY_ORG: xenomorphic-dev
          SENTRY_PROJECT: xenomorphic
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    timeout-minutes: 60
  notify_on_failure:
    needs:
      - bundle_linux_aarch64
      - bundle_linux_x86_64
      - bundle_mac_aarch64
      - bundle_mac_x86_64
    if: failure()
    runs-on: namespace-profile-2x4-ubuntu-2404
    steps:
      - name: release::send_slack_message
        run: 'curl -X POST -H ''Content-type: application/json'' --data "$(jq -n --arg text "$SLACK_MESSAGE" ''{"text": $text}'')" "$SLACK_WEBHOOK"'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_WORKFLOW_FAILURES }}
          SLACK_MESSAGE: "❌ ${{ github.workflow }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
defaults:
  run:
    shell: bash -euxo pipefail {0}
