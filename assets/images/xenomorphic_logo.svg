<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  Xenomorphic "X" mark — a single geometric cross with negative-space
  chevron cutouts at the center, inspired by the Zed logo's layered
  rectangle aesthetic. Uses only fill=black since gpui renders SVGs
  as alpha masks (all color/opacity is stripped).
-->
<path d="
  M 0 0
  H 20
  L 48 30
  L 76 0
  H 96
  V 20
  L 66 48
  L 96 76
  V 96
  H 76
  L 48 66
  L 20 96
  H 0
  V 76
  L 30 48
  L 0 20
  Z
" fill="black"/>
</svg>
